<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
/* La identidad de Mind the Context, la misma del sitio publicado: crema, tinta, azul y ámbar;
   serif humanista para el título, sans del sistema para el cuerpo, mono para los rótulos. Sin
   fuentes descargadas. La paleta de DATOS es aparte (está en la receta) y no cambia con el tema. */
:root{
  --crema:#F7F3E7; --crema-hueso:#F2ECDD; --tinta:#2C231F; --tinta-honda:#221B17;
  --azul:#0A4E75; --ambar:#E09C46; --ambar-hondo:#87560D;
  --fondo:var(--crema); --panel:var(--crema-hueso); --superficie:#FFFDF7;
  --texto:var(--tinta); --texto-suave:#5C4436; --texto-tenue:#83604D;
  --regla:#DED6C2; --acento:var(--azul); --marca-cuadro:var(--ambar-hondo);
  --fig-regla:#5C4436;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fondo:var(--tinta); --panel:var(--tinta-honda); --superficie:#2A211C;
    --texto:var(--crema); --texto-suave:#C9B9A8; --texto-tenue:#A8968A;
    --regla:#453931; --acento:#6BA6CC; --marca-cuadro:var(--ambar); --fig-regla:#C9B9A8;
  }
}
:root[data-theme="dark"]{
  --fondo:var(--tinta); --panel:var(--tinta-honda); --superficie:#2A211C;
  --texto:var(--crema); --texto-suave:#C9B9A8; --texto-tenue:#A8968A;
  --regla:#453931; --acento:#6BA6CC; --marca-cuadro:var(--ambar); --fig-regla:#C9B9A8;
}
:root[data-theme="light"]{
  --fondo:var(--crema); --panel:var(--crema-hueso); --superficie:#FFFDF7;
  --texto:var(--tinta); --texto-suave:#5C4436; --texto-tenue:#83604D;
  --regla:#DED6C2; --acento:var(--azul); --marca-cuadro:var(--ambar-hondo); --fig-regla:#5C4436;
}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 48px;background:var(--fondo);color:var(--texto);
  font:400 1rem/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto}
figure{margin:0;background:var(--superficie);border:1px solid var(--regla);padding:18px 18px 14px}
/* Los tres textos de una figura tienen roles distintos: QUÉ se ve, unidad y alcance, y de dónde sale. */
.ft{font:600 1.2rem/1.3 var(--serif);margin:0 0 4px;color:var(--texto)}
.fs{font:400 .82rem/1.4 var(--mono);margin:0 0 14px;color:var(--texto-tenue);letter-spacing:.01em}
.grafico{min-height:40px}
.grafico svg{display:block;max-width:100%;height:auto;overflow:visible}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px;font-size:.84rem;color:var(--texto-suave)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.notas{margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--regla);font-size:.86rem;color:var(--texto-suave)}
.notas ul{margin:0;padding-left:1.1em}
.notas li{margin:0 0 4px}
.notas .marca{color:var(--marca-cuadro);font-weight:600}
.src{margin:10px 0 0;font:italic .8rem/1.45 var(--sans);color:var(--texto-tenue)}
.negativa{background:var(--panel);border-left:3px solid var(--marca-cuadro);padding:10px 12px;font-size:.88rem}
/* El reporte: portada, secciones y lecturas. */
.portada{padding:8px 0 18px;border-bottom:2px solid var(--texto);margin-bottom:8px}
.portada h1{font:600 1.8rem/1.2 var(--serif);margin:0 0 6px}
.portada .sub{font:400 .9rem/1.4 var(--mono);color:var(--texto-tenue);margin:0 0 14px}
.portada .sedes{columns:2;column-gap:24px;margin:6px 0 10px;padding-left:1.1em}
.portada .retirada{background:var(--panel);border-left:3px solid var(--marca-cuadro);padding:8px 12px}
.portada .universo{font-size:.86rem;color:var(--texto-tenue)}
section{padding:22px 0 8px}
section h2{font:600 1.35rem/1.25 var(--serif);margin:0 0 4px}
section .pregunta{color:var(--texto-tenue);margin:0 0 14px}
section figure{margin:14px 0}
.lectura{max-width:68ch;margin:0 0 18px}
.lectura p{margin:0 0 10px}
.lectura .compatible{font-size:.92rem;color:var(--texto-suave);border-left:2px solid var(--regla);padding-left:10px}
.tw{overflow-x:auto}.tw table{border-collapse:collapse;width:100%;font-size:.86rem}.tw th,.tw td{padding:6px 10px;border-bottom:1px solid var(--regla);text-align:left}
footer{margin-top:22px;border-top:1px solid var(--regla);padding-top:10px}
@media (max-width:520px){figure{padding:14px 12px 12px}.ft{font-size:1.08rem}.portada .sedes{columns:1}.portada h1{font-size:1.45rem}}
@media print{body{background:#fff;padding:0}figure{border:none}}
</style>
</head>
<body>
<div class="wrap">
__CUERPO__
</div>
<script>/* __D3__ */</script>
<script>/* __PLOT__ */</script>
<script>
__RECETAS__
const FIGURAS = /* __FIGURAS__ */;
function pintar(){
  for (const [id, spec] of Object.entries(FIGURAS)) {
    const destino = document.getElementById("fig-" + id);
    if (!destino) continue;
    destino.replaceChildren();
    try {
      const ley = leyenda(spec);
      if (ley) destino.append(ley);
      destino.append(dibujar(spec, destino.clientWidth));
    } catch (error) {
      const aviso = document.createElement("p");
      aviso.className = "negativa";
      aviso.textContent = "La figura no pudo dibujarse: " + error.message;
      destino.append(aviso);
    }
  }
}
document.addEventListener("DOMContentLoaded", pintar);
// Se redibuja al cambiar el ancho, para que los rótulos sigan legibles en un teléfono.
let espera;
addEventListener("resize", () => { clearTimeout(espera); espera = setTimeout(pintar, 150); });
</script>
</body>
</html>
